<div class="row justify-content-center fade-in">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">
                    <i class="bi bi-person-fill me-2"></i>
                    {{ isUpdateMode ? 'Actualizar Cliente' : (isViewMode ? 'Detalles del Cliente' : 'Nuevo Cliente') }}
                </h3>
            </div>
            <div class="card-body">
                <form (ngSubmit)="onSubmit()" #clientForm="ngForm">
                    <div class="mb-3">
                        <label for="firstName" class="form-label">Nombre</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" 
                                   class="form-control" 
                                   id="firstName" 
                                   [(ngModel)]="client.firstName" 
                                   name="firstName" 
                                   required 
                                   [readonly]="isViewMode"
                                   #firstName="ngModel">
                        </div>
                        <div class="text-danger" *ngIf="firstName.invalid && (firstName.dirty || firstName.touched)">
                            El nombre es requerido
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="lastName" class="form-label">Apellido</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" 
                                   class="form-control" 
                                   id="lastName" 
                                   [(ngModel)]="client.lastName" 
                                   name="lastName" 
                                   required 
                                   [readonly]="isViewMode"
                                   #lastName="ngModel">
                        </div>
                        <div class="text-danger" *ngIf="lastName.invalid && (lastName.dirty || lastName.touched)">
                            El apellido es requerido
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" 
                                   class="form-control" 
                                   id="email" 
                                   [(ngModel)]="client.email" 
                                   name="email" 
                                   required 
                                   email
                                   [readonly]="isViewMode"
                                   #email="ngModel">
                        </div>
                        <div class="text-danger" *ngIf="email.invalid && (email.dirty || email.touched)">
                            <div *ngIf="email.errors?.['required']">El email es requerido</div>
                            <div *ngIf="email.errors?.['email']">Por favor ingrese un email válido</div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <button class="btn btn-secondary" type="button" (click)="goToClientList()">
                            <i class="bi bi-arrow-left me-2"></i>Volver
                        </button>
                        <button *ngIf="!isViewMode" 
                                class="btn btn-primary" 
                                type="submit" 
                                [disabled]="!clientForm.form.valid">
                            <i class="bi" [ngClass]="isUpdateMode ? 'bi-check-circle' : 'bi-plus-circle'"></i>
                            {{ isUpdateMode ? ' Actualizar' : ' Guardar' }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
.form-control:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
}
</style>
